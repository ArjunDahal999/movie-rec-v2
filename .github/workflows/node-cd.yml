name: Node CD

on:
  workflow_run:
    workflows: ["Node CI"]
    types:
      - completed

jobs:
  build:
    runs-on: self-hosted

    steps:
      - name: Checkout repository
        run: cd /home/ubuntu/movie-rec-v2/server
      - name: Pull Docker image
        run: sudo docker pull arzun99/movieflix-node-server
      - name: Delete Old docker container
        run: sudo docker rm -f cicd-pipeline-container || true
      - name: Run Docker Container
        run: sudo docker run -d -p 4000:4000 --name cicd-pipeline-container arzun99/movieflix-node-server:latest
